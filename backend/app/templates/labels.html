<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  {% if layout == "thermal_50x25" %}
  @page { size: 50mm 25mm; margin: 1.5mm; }
  .sheet { display: block; }
  .label { width: 47mm; height: 22mm; page-break-after: always; }
  .label img { height: 9mm; }
  {% else %}
  @page { size: A4; margin: 10mm 7mm; }
  .sheet { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 34.5mm; column-gap: 3mm; }
  .label { border: 0.2mm dashed #ccc; }
  .label img { height: 13mm; }
  {% endif %}
  body { font-family: "DejaVu Sans", sans-serif; margin: 0; }
  .label { box-sizing: border-box; padding: 1.5mm 2mm; overflow: hidden; text-align: center; }
  .title { font-size: 7.5pt; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line { font-size: 6.5pt; color: #333; }
  .label img { max-width: 100%; margin-top: 0.5mm; }
</style>
</head>
<body>
<div class="sheet">
{% for l in labels %}
  <div class="label">
    <div class="title">{{ l.title }}</div>
    {% for line in l.lines %}<div class="line">{{ line }}</div>{% endfor %}
    <img src="{{ l.code }}">
  </div>
{% endfor %}
</div>
</body>
</html>
