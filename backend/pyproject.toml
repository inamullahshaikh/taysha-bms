[project]
name = "taysha-bms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.17",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "jinja2>=3.1",
    "weasyprint>=63",
    "openpyxl>=3.1",
    "segno>=1.6",
    "python-barcode>=0.15",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using .httpx."]

[tool.ruff]
line-length = 110
