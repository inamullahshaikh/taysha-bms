services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taysha
      POSTGRES_PASSWORD: taysha
      POSTGRES_DB: taysha
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taysha"]
      interval: 2s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://taysha:taysha@db:5432/taysha
      TEST_DATABASE_URL: postgresql+psycopg://taysha:taysha@db:5432/taysha_test
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /data/uploads
    ports: ["8010:8000"]
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db: { condition: service_healthy }

  scheduler:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://taysha:taysha@db:5432/taysha
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    command: python -m app.jobs --loop
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
